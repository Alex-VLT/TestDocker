services:
  php:
    image: php:8.2-apache
    container_name: php_82
    ports:
      - 8000:80
    build:
      context: ./Symfony
      dockerfile: Dockerfile
    depends_on:
      db:
  db:
    image: mysql:8.0
    container_name: mysql_8
    volumes:
      - ./base:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: demo
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
  react:
    image: node:latest
    container_name : react
    ports:
      - 8001:5173
    build:
      context: ./React
      dockerfile: Dockerfile
